# Render Blueprint for the portfolio assistant API (backend/).
# The static site itself is hosted separately (GitHub Pages / Netlify).
services:
  - type: web
    name: simran-portfolio-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: azure
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        value: 2024-10-21
      - key: AZURE_OPENAI_DEPLOYMENT
        value: gpt-4o
      - key: AZURE_OPENAI_LEGACY_API
        value: "false"
      - key: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
        sync: false
      - key: RAG_TOP_K
        value: "5"
      - key: LLM_TEMPERATURE
        value: "0.2"
      - key: LLM_MAX_TOKENS
        value: "600"
      - key: ALLOWED_ORIGINS
        value: https://simrann-ux.github.io
      - key: SERVE_FRONTEND
        value: "false"
